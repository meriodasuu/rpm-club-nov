name: RPM Club checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rpm
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: rpm_club_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rpm -d rpm_club_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rpm:synthetic-ci-only@127.0.0.1:5432/rpm_club_test
      DATABASE_URL: postgresql://rpm:synthetic-ci-only@127.0.0.1:5432/rpm_club_test
      APP_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
