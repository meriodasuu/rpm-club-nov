# Isolated local development database. Never use trust authentication in production.
services:
  db:
    image: postgres:17-alpine
    container_name: rpm-club-db
    environment:
      POSTGRES_USER: rpm
      POSTGRES_DB: rpm_club
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - rpm-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpm -d rpm_club"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rpm-data:
    name: rpm-club-data
